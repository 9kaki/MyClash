name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AIsouler/MyClash.git
          git fetch upstream main
          if ! git merge --no-edit -X theirs upstream/main; then
            git merge --abort || true
            {
              echo '## Upstream sync stopped'
              echo
              echo 'The upstream merge could not be completed safely.'
              echo 'No changes were pushed to main.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Reapply customizations
        run: node .github/scripts/apply-customizations.mjs

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check Script/mihomoScript.js
          node --check Script/Script.js
          git diff --check
          if git grep -n -E '<<<<<<<|=======|>>>>>>>' -- ':!*.md'; then
            echo 'Conflict markers remain in the working tree.'
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add Script/mihomoScript.js Config/mihomoConfig.yaml
          if git diff --cached --quiet; then
            echo 'No upstream or customization changes to push.'
          else
            git commit -m "chore: sync with upstream and reapply customizations"
            git push origin HEAD:main
          fi
