name: Sync Fork with Upstream

on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）运行一次
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AIsouler/MyClash.git
          git fetch upstream
          git checkout main
          if git merge --no-ff upstream/main -m "chore: sync with upstream AIsouler/MyClash"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push merged result
        if: steps.merge.outputs.merged == 'true'
        run: git push origin main

      - name: Open issue on conflict
        if: steps.merge.outputs.merged == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 自动同步上游失败：存在合并冲突',
              body: '定时同步 AIsouler/MyClash 时遇到合并冲突，已自动中止，未推送任何更改。请手动处理冲突后再同步。\n\n失败的运行：' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
