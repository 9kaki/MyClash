name: Sync Fork with Upstream

on:
  schedule:
    - cron: '20 3 * * *'    # UTC 03:20，北京时间 11:20（主触发）
    - cron: '45 10 * * *'   # UTC 10:45，北京时间 18:45（备份触发）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Merge upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AIsouler/MyClash.git
          git fetch upstream main
          if ! git merge --no-edit -X theirs upstream/main; then
            git merge --abort || true
            {
              echo '## Upstream sync stopped'
              echo
              echo 'The upstream merge could not be completed safely.'
              echo 'No changes were pushed to main.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Reapply customizations
        run: node .github/scripts/apply-customizations.mjs

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check Script/mihomoScript.js
          node --check Script/Script.js
          node --check .github/scripts/apply-customizations.mjs
          node Test/run-tests.js --node
          if git grep -n -F '\n' -- Config; then
            echo 'Literal \\n found in Config files.'
            exit 1
          fi
          git diff --check
          if git grep -n -E '^[[:space:]]*(<<<<<<<|=======|>>>>>>>)($|[[:space:]])' -- ':!*.md'; then
            echo 'Conflict markers remain in the working tree.'
            exit 1
          fi

      - name: Commit customizations and push
        shell: bash
        run: |
          set -euo pipefail
          git add Script/mihomoScript.js Config/mihomoConfig.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync with upstream and reapply customizations"
          fi

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo 'No upstream or customization changes to push.'
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo 'Push failed after 3 attempts.'
              exit 1
            fi

            echo "Push was rejected; refreshing origin/main and retrying (attempt $((attempt + 1))/3)."
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              echo 'Could not merge the latest origin/main before retrying.'
              exit 1
            fi

            node .github/scripts/apply-customizations.mjs
            node --check Script/mihomoScript.js
            node --check Script/Script.js
            node --check .github/scripts/apply-customizations.mjs
            node Test/run-tests.js --node
            if git grep -n -F '\n' -- Config; then
              echo 'Literal \\n found in Config files.'
              exit 1
            fi
            git diff --check
            if git grep -n -E '^[[:space:]]*(<<<<<<<|=======|>>>>>>>)($|[[:space:]])' -- ':!*.md'; then
              echo 'Conflict markers remain in the working tree.'
              exit 1
            fi

            git add Script/mihomoScript.js Config/mihomoConfig.yaml
            if ! git diff --cached --quiet; then
              git commit -m "chore: sync with upstream and reapply customizations"
            fi
          done


      - name: Create issue on failure
        if: ${{ failure() }}
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '上游同步失败';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'open',
                per_page: 100
              }
            );

            const exists = issues.some(issue => issue.title === title);

            if (!exists) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: [
                  '上游同步工作流执行失败。',
                  '',
                  `工作流：${context.workflow}`,
                  `运行记录：${runUrl}`,
                  `提交：${context.sha}`,
                  '',
                  '请打开运行记录查看具体错误。'
                ].join('\n')
              });
            } else {
              core.info('已有未关闭的同步失败 Issue，不重复创建。');
            }
